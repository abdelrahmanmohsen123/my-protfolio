# Nginx Virtual Host Configuration for Abdelrahman Mohsen Portfolio
# Location on VPS: /etc/nginx/sites-available/abdelrahman-portfolio
# Symlink: sudo ln -s /etc/nginx/sites-available/abdelrahman-portfolio /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com; # Replace with your actual domain or VPS IP

    # Web root directory (where you uploaded the dist/ contents)
    root /var/www/abdelrahman-portfolio/dist;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip compression for fast loading
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Cache static assets (CSS, JS, images, SVG, CV files)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Route all requests to index.html for Single-Page Application behavior
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Specific access rule for CV static files
    location /cv/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    # Deny access to hidden files (except Let's Encrypt challenge)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_page 404 /index.html;
}
